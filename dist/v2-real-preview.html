<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e9ddc8">
  <meta name="description" content="团团的温馨 3D 小屋：直接触摸仓鼠和房间里的物品来陪它玩。">
  <title>团团小屋 · 3D</title>
  <link rel="stylesheet" href="v2-real-preview.css">
</head>
<body>
<main class="game-shell">
  <header class="game-topbar">
    <div class="brand"><span class="brand-mark">🐹</span><div><h1>团团小屋</h1><p id="top-status">摸摸团团，或者直接点房间里的东西</p></div></div>
    <div class="top-actions"><button id="camera-orbit" class="icon-btn" title="轻轻转动房间">↻</button><a class="icon-btn" href="index.html" title="返回旧版">2D</a></div>
  </header>

  <section class="game-card">
    <div class="screen-wrap">
      <canvas id="stage" width="320" height="180" aria-label="团团的3D小房间"></canvas>
      <div class="screen-status"><span id="status">加载团团的小房间…</span></div>
      <div class="touch-hint" id="touch-hint">轻点摸摸 · 长按变形 · 拖动捧起</div>
    </div>

    <div class="game-stats" aria-label="团团状态">
      <div class="stat"><span>饱腹</span><b id="stat-hunger">--</b><i><em id="bar-hunger"></em></i></div>
      <div class="stat"><span>精力</span><b id="stat-energy">--</b><i><em id="bar-energy"></em></i></div>
      <div class="stat"><span>心情</span><b id="stat-mood">--</b><i><em id="bar-mood"></em></i></div>
      <div class="stat mode-stat"><span>现在</span><b id="stat-mode">loading</b><small id="stat-save">读取存档中</small></div>
    </div>

    <details class="more-panel" id="more-panel">
      <summary>更多操作 <span>备用按钮与镜头</span></summary>
      <div class="panel-body">
        <div class="controls care-controls" aria-label="备用养成操作">
          <button data-action="feed">🥣 喂食</button>
          <button data-action="sleep">💤 睡觉</button>
          <button data-action="wheel">🎡 滚轮</button>
          <button data-action="pickup">👐 捧起</button>
          <button data-action="pet">💗 摸摸</button>
          <button data-action="shape">🥞 变形</button>
          <button data-action="stash">🌻 藏粮</button>
          <button data-action="move-stash">🫣 挪粮仓</button>
        </div>
        <div class="controls camera-controls" aria-label="镜头方向">
          <button id="turn-left">← 左侧</button>
          <button id="turn-front" class="active">正面</button>
          <button id="turn-right">右侧 →</button>
        </div>
      </div>
    </details>
  </section>

  <footer>Hamster model CC0 · Furniture CC0 · <button id="credits-toggle" type="button">素材说明</button></footer>
  <dialog id="credits-dialog"><button id="credits-close" class="dialog-close" aria-label="关闭">×</button><h2>素材与许可</h2><p>「ハムちゃん / Hamster」by 如月十二 · CC0</p><p>Furniture by Kenney · CC0</p><p>Three.js · MIT</p></dialog>
</main>
<script type="module" src="v2-game.bundle.js"></script>
</body>
</html>
