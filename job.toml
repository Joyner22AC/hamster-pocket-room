output_requirements = [
  "新增独立 V8 入口 dist/v8-hamster-natural.html/css/js，保留 V7 作为对照",
  "角色整体更低、更宽、更偏侧向 3/4，减少直立人偶感",
  "眼睛改为深棕哑光，毛发降低塑料高光",
  "idle 的前爪保持靠近胸前，不出现明显 T-pose/人类摆臂",
