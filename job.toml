output_requirements = [
  "新增独立 V7 入口 dist/v7-hamster-alive.html/css/js，不破坏旧版本",
  "静态角色必须使用真实 skinned 3D hamster mesh，不再用圆片脸颊、可见分件拼装或纸片整图作为角色本体",
  "角色渲染使用平滑纹理、柔和 PBR/灯光与抗锯齿，避免 V2 最近邻像素化导致的粗糙感",
  "动画必须直接驱动骨骼并使用 AnimationMixer cross-fade；禁止把整体 bob 当作主要动作",
  "至少完成 idle、walk、eat、pet-react、pickup/drop、run-wheel、sleep/wake",
  "walk/eat/pickup/run 必须有重心变化、头部/躯干/四肢不同步和 settle",
  "抚摸支持角色上的水平手势触发 nuzzle；长按再拖进入捧起，避免和普通抚摸冲突",
  "复用正式 engine.js 玩法规则，但使用 V7 独立 localStorage key",
  "保留 V4 暖阳木质房间的视觉方向作为背景，不回到 V2 低多边形家具主场景",
  "桌面与 390px 手机均无横向溢出，移动端 >=30 FPS，目标 60 FPS",
  "npm run check、npm test、git diff --check 和真实浏览器交互验证通过",
  "完成后更新共享状态，commit/push master 并等待 GitHub Pages 成功"
]

