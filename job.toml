[stage_gate.character_art]
criteria = [
  "静态角色第一眼明确是仓鼠而非熊/猫/人偶",
  "不存在独立圆形脸颊贴片、机械关节或纸片轮廓",
  "三维体积、短鼻吻、小耳、短前爪和低重心清晰",
  "在手机尺寸仍能读出眼、耳、鼻吻和身体体积"
]

[stage_gate.motion]
criteria = [
  "核心动作实际驱动多个骨骼",
  "动作有 anticipation/weight shift/secondary motion/settle",
  "AnimationMixer cross-fade 无明显瞬切",
  "直接手势至少改变 pet 与 pickup 两类反应",
  "390px 可操作且 >=30 FPS"
]

