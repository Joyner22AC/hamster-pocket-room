  "桌面与 390px 手机真实浏览器验证无横向溢出、无运行时错误、>=30 FPS",
  "npm run check、npm test、git diff --check 通过",
  "只完成本地候选与共享状态，不 commit/push/publish，除非用户另行明确授权"
]

