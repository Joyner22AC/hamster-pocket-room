objective = "在 V7 已验证的真实 41-joint skinned hamster 基础上继续精修角色本体，优先消除直立人偶感、前爪外展和塑料感；通过更低重心比例、侧向 3/4 视角、哑光材质以及更动物化的骨骼动作完成独立 V8 候选。"
